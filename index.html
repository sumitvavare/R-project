<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shri Rama Quiz Arena</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="card hero">
        <h1>Shri Rama Quiz Arena</h1>
        <p>Answer the quiz, finish quickly, and climb the leaderboard.</p>
      </header>

      <section class="card" id="start-card">
        <h2>Start Quiz</h2>
        <label for="player-name">Your name</label>
        <div class="start-row">
          <input id="player-name" type="text" maxlength="20" placeholder="Enter your name" />
          <button id="start-btn" type="button">Start</button>
        </div>
      </section>

      <section class="card hidden" id="quiz-card">
        <div class="status-bar">
          <span id="progress">Question 1 of 10</span>
          <span id="timer">Time: 0s</span>
        </div>
        <h2 id="question-text"></h2>
        <div id="options" class="options"></div>
        <div class="actions">
          <button id="prev-btn" type="button" class="secondary">Previous</button>
          <button id="next-btn" type="button">Next</button>
          <button id="submit-btn" type="button" class="hidden">Submit Quiz</button>
        </div>
      </section>

      <section class="card hidden" id="result-card">
        <h2>Result</h2>
        <p id="result-text"></p>
        <button id="restart-btn" type="button">Play Again</button>
      </section>

      <section class="card" id="leaderboard-card">
        <h2>Leaderboard</h2>
        <p class="hint">Sorted by highest score, then shortest time.</p>
        <ol id="leaderboard-list"></ol>
        <button id="clear-btn" type="button" class="danger">Clear Leaderboard</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
